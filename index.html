<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蔵書リスト</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/public.css">
</head>
<body>
<nav class="site-nav">
  <a class="brand" href="/">FU NOGUCHI LAB.</a>
  <div class="nav-links">
    <a href="https://yutanoguchi051.github.io/">PROFILE</a>
    <a href="https://yutanoguchi051.github.io/FU-NoguchiLab/">LAB</a>
    <span class="current">ExLibris</span>
  </div>
</nav>

<header class="site-header">
  <p class="kicker">ExLibris</p>
  <p class="intro">
    544B室の蔵書リストです。なお，永遠に整備中であり，蔵書の全てを網羅できていません。<br>
    個人の確認用ですが，タグクラウドから選書リストとして使えるようになることを期待しています。
  </p>
</header>

<main>
  <div class="search-bar">
    <input type="search" id="search-input" placeholder="タイトル・著者・ISBN・タグで検索">
  </div>

  <div id="tag-filter" class="tag-filter"></div>

  <div class="list-toolbar">
    <div id="book-count" class="book-count"></div>
    <div class="sort-buttons">
      <button id="sort-title-btn" class="sort-btn active">タイトル順</button>
      <button id="sort-year-btn" class="sort-btn">発行年順</button>
    </div>
  </div>

  <div id="book-list" class="book-list"></div>
  <p id="empty-message" class="status hidden">該当する本が見つかりませんでした。</p>
</main>

<footer class="site-footer">
  <p class="hint">最終更新: <span id="last-updated">-</span></p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
